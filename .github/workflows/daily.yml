# .github/workflows/daily.yml — refresh college data every morning, redeploy on change
name: daily-refresh
on:
  schedule:
    - cron: "15 5 * * *"        # 05:15 UTC = 06:15 Oxford in summer
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml
      - name: Scrape tier-B colleges and harvest contacts
        working-directory: pipeline
        run: |
          python scrape.py || true          # exit 1 just means "something changed"
          python contacts.py
      - name: Rebuild the full site (index + 43 college pages) with today's date
        run: python3 generator/build.py     # reads pipeline/data_block.js, writes deploy/
      - name: Commit if anything moved (triggers Railway deploy)
        run: |
          git config user.name "oxfordquads-bot"
          git config user.email "bot@oxfordquads.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily refresh $(date -u +%F)"
          git push
